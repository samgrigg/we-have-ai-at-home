# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Paid, always-on POC resources; review the Render plan before applying.
projects:
  - name: household-assistant
    environments:
      - name: poc
        databases:
          - name: household-poc-db
            plan: 0.1c-256mb
            region: oregon
            postgresMajorVersion: "17"
            databaseName: household
            user: household
            diskSizeGB: 1
            connectionPool: none
            ipAllowList: []
        services:
          - type: web
            name: household-poc-api
            runtime: docker
            plan: 0.5c-512mb
            region: oregon
            dockerfilePath: ./Dockerfile
            preDeployCommand: python -m household.db
            dockerCommand: uvicorn household.api:create_app --factory --host 0.0.0.0 --port 10000
            healthCheckPath: /health
            autoDeployTrigger: "off"
            envVars:
              - key: FAMILY_ALLOWED_EMAILS
                sync: false
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: GOOGLE_CLIENT_SECRET
                sync: false
              - key: SESSION_SECRET
                generateValue: true
              - key: PUBLIC_BASE_URL
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: household-poc-db
                  property: connectionString
          - type: worker
            name: household-poc-worker
            runtime: docker
            plan: 0.5c-512mb
            region: oregon
            dockerfilePath: ./Dockerfile
            preDeployCommand: python -m household.db
            dockerCommand: python -m household.worker
            maxShutdownDelaySeconds: 60
            autoDeployTrigger: "off"
            envVars:
              - key: FAMILY_ALLOWED_EMAILS
                fromService:
                  name: household-poc-api
                  type: web
                  envVarKey: FAMILY_ALLOWED_EMAILS
              - key: DATABASE_URL
                fromDatabase:
                  name: household-poc-db
                  property: connectionString
              - key: OPENAI_API_KEY
                sync: false
              - key: MODEL_NAME
                value: gpt-4.1-mini
